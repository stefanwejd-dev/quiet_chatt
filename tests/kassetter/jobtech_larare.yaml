        bes\u00f6k.\n\nI Landskrona stad med drygt 3300 medarbetare arbetar vi efter
        v\u00e5r v\u00e4rdegrund BRA, d\u00e4r B st\u00e5r f\u00f6r bem\u00f6tande,
        R f\u00f6r resultat och A f\u00f6r ansvar. V\u00e5r v\u00e4rdegrund ska genomsyra
        all v\u00e5r verksamhet och vi ska vara en arbetsplats d\u00e4r du k\u00e4nner
        arbetsgl\u00e4dje och stolthet. H\u00e4r finns utrymme f\u00f6r dig med mod
        och handlingskraft och du f\u00e5r m\u00f6jlighet att utvecklas.\n\nVill du
        vara med och p\u00e5verka utvecklingen i en av Sk\u00e5nes mest sp\u00e4nnande
        st\u00e4der? V\u00e4lkommen med din ans\u00f6kan!\r\n\r\n1 plats(er). \r\n\r\nARBETSUPPGIFTER\r\nVill
        du vara en del av en verksamhet d\u00e4r kvalitet, tydlighet och elevens b\u00e4sta
        st\u00e5r i centrum?\n\nI rollen som l\u00e4rare i \u00e5rskurs 4-6 undervisar
        du elever som \u00e4r i b\u00f6rjan av sin mellanstadietid och som utvecklar
        allt st\u00f6rre f\u00f6rm\u00e5ga att ta ansvar f\u00f6r sitt l\u00e4rande.
        Du skapar en strukturerad och stimulerande undervisning som ger eleverna goda
        f\u00f6ruts\u00e4ttningar att n\u00e5 sina kunskapsm\u00e5l och st\u00e4rkas
        socialt. Tillsammans med erfarna och engagerade kollegor bidrar du till en
        trygg och v\u00e4lfungerande l\u00e4rmilj\u00f6 d\u00e4r elevernas utveckling
        st\u00e5r i fokus.\n\nArbetsuppgifterna innefattar bland annat:\u00a0\n\n\t\u2022
        Planera, genomf\u00f6ra och f\u00f6lja upp undervisning utifr\u00e5n g\u00e4llande
        styrdokument.\n\t\u2022 St\u00f6dja elevernas kunskapsutveckling genom varierade
        arbetss\u00e4tt och tydlig struktur.\n\t\u2022 Bed\u00f6ma, dokumentera och
        ge \u00e5terkoppling p\u00e5 elevernas l\u00e4rande.\n\t\u2022 Skapa en trygg
        och inkluderande milj\u00f6 d\u00e4r eleverna k\u00e4nner motivation och studiero.\n\t\u2022
        Arbeta med anpassningar och extra st\u00f6d utifr\u00e5n elevers olika behov.\n\t\u2022
        Samarbeta i arbetslag och bidra till skolans utvecklingsarbete.\n\nV\u00e5rt
        erbjudande:\u00a0\n\nHos oss f\u00e5r du m\u00f6jlighet att utvecklas i din
        yrkesroll, p\u00e5verka undervisningen och bidra till skolans fortsatta kvalitetsarbete.
        Vi v\u00e4rnar om en trygg och inkluderande kultur d\u00e4r b\u00e5de personal
        och elever f\u00e5r r\u00e4tt f\u00f6ruts\u00e4ttningar att lyckas och trivas.\r\n\r\nKVALIFIKATIONER\r\nVi
        s\u00f6ker dig som arbetar strukturerat och m\u00e5lmedvetet, med f\u00f6rm\u00e5ga
        att planera och organisisera ditt arbete med kvalitet. Du \u00e4r stabil och
        hanterar stressade situationer professionellt, samtidigt som du beh\u00e5ller
        ett positivt bem\u00f6tande. Som person \u00e4r du relationsskapande och tar
        naturligt initiativ i m\u00f6tet med b\u00e5de elever och kollegor, vilket
        bidrar till ett \u00f6ppet och f\u00f6rtroendefullt klimat. Du \u00e4r ocks\u00e5
        samarbetsorienterad, prestigel\u00f6s och har l\u00e4tt f\u00f6r att hitta
        l\u00f6sningar tillsammans med andra med fokus p\u00e5 det gemensamma m\u00e5let.\n\nKrav
        f\u00f6r tj\u00e4nsten:\u00a0\n\n\t\u2022 Aktuell kunskap om styrdokument,
        s\u00e5som l\u00e4roplan, kursplaner och bed\u00f6mningskriterier\n\t\u2022
        Beh\u00e4rskar det svenska spr\u00e5ket i tal och skrift\n\t\u2022 Erfarenhet
        av undervisning under minimum 3 \u00e5r i \u00e4mnena matematik, NO och teknik.\n\t\u2022
        L\u00e5ng erfarenhet av praktiskt arbete som l\u00e4rare i grundskola, minimum
        10 \u00e5r.\u00a0\n\t\u2022 Goda referenser fr\u00e5n tidigare skolledare
        (chef) p\u00e5 arbetsplatsen du arbetat under minimum 3 \u00e5rs tid.\u00a0\n\nVi
        \u00e4r i behov av en erfaren l\u00e4rare med goda referenser fr\u00e5n l\u00e5ngvarigt
        arbete inom skola. Vi l\u00e4gger d\u00e4rf\u00f6r stor vikt vid personliga
        egenskaper och erfarenheter i rekryteringsprocess och urval.\u00a0\n\nI denna
        rekrytering ber vi dig att bifoga ditt CV samt besvara ett antal urvalsfr\u00e5gor.\u00a0\n\nSyftet
        med urvalsfr\u00e5gorna \u00e4r att skapa en effektivare och mer r\u00e4ttvis
        rekryteringsprocess, d\u00e4r alla kandidater bed\u00f6ms utifr\u00e5n samma
        kompetensbaserade kriterier. \u00a0\n\nV\u00e4lkommen med din ans\u00f6kan!\r\n\r\nL\u00f6neform:
        M\u00e5nadsl\u00f6n.\r\nAnst\u00e4llningsform: Tidsbegr\u00e4nsad anst\u00e4llning.\r\nVaraktighet:
        3-6 m\u00e5nader, tilltr\u00e4de: 2026-08-19  , upph\u00f6r: 2026-12-31  .\r\nArbetstid:
        Dagtid.\r\n\r\nArbetsgivarinformation:  https://www.landskrona.se/jobbailandskronastad\n\nF\u00f6r
        att kvalitetss\u00e4kra rekryteringsprocessen i Landskrona stad anv\u00e4nder
        vi rekryteringsverktyget Visma Recruit. D\u00e4rf\u00f6r ber vi dig att skicka
        in din ans\u00f6kan via Visma Recruit genom att klicka p\u00e5 ans\u00f6kningsl\u00e4nken
        i annonsen. En ans\u00f6kan till Landskrona stad \u00e4r en allm\u00e4n handling
        och dina personuppgifter hanteras enligt GDPR.\n\nD\u00e5 vi inf\u00f6r denna
        rekrytering redan tagit st\u00e4llning till de rekryteringskanaler vi \u00f6nskar
        anv\u00e4nda undanber vi oss att bli kontaktade f\u00f6r ytterligare erbjudanden
        om kompetensf\u00f6rmedling samt annonserings- och rekryteringshj\u00e4lp.\n\nOm
        du som s\u00f6kande har skyddade personuppgifter, beh\u00f6ver du kontakta
        rekryterande chef f\u00f6r att f\u00e5 tillg\u00e5ng till urvalsfr\u00e5gorna.
        Du skickar din ans\u00f6kan till HR-avdelningen via post eller l\u00e4mnar
        in den i receptionen, st\u00e4lld till HR-enheten d\u00e4r du ocks\u00e5 anger
        vilket referensnummer annonsen har.\n\nI din ans\u00f6kan beh\u00f6ver du
