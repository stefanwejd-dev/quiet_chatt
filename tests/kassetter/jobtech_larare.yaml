        anst\u00e4lld hos oss. D\u00e4refter gallras handlingarna. Du kan l\u00e4sa
        mer om hur vi behandlar dina personuppgifter p\u00e5 https://www.landskrona.se/kommun-och-politik/sa-behandlar-landskrona-stad-personuppgifter/.",
