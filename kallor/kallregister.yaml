      den formaterar bara en sökterm till en URL enligt ett fast, dokumenterat
      mönster (https://www4.skatteverket.se/rattsligvagledning/3236.html?q=…).
      "Verifierad" betyder här att URL-mallen är kontrollerad manuellt, inte
