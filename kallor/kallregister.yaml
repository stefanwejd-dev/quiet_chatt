    licens: okänd
    attribution: "Källa: Skatteverket, Rättslig vägledning"
    takt: { anrop: 10, per_sekunder: 1 }
    cache_ttl: 86400
    notering: >
      Portering av Juridikchatt::skapa_lank_skatteverket() från quiet.nu:s
