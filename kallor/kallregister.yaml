# Källregister — Quiet Öppen Data
#
# Detta är systemets enda sanning om vilka källor som finns och hur de nås.
# Ingen bas-URL får hårdkodas i Python. All kod läser härifrån.
#
# verifierad: ja  = anropad live och svaret inspekterat 2026-08-13
# verifierad: nej = sökväg/anropsform EJ bekräftad. Implementatören MÅSTE anropa
#                   källan och inspektera svaret innan den aktiveras. Gissa aldrig.
#
# blockerad: true = källan får aldrig anropas. Kontrolleras i adapterlagrets ingång.

version: 1
uppdaterad: 2026-08-13

# ---------------------------------------------------------------------------
# SPÄRRADE KÄLLOR — ligger här enbart för att spärren ska vara explicit
# ---------------------------------------------------------------------------

kallor:
  - id: polisen_efterlysta
    myndighet: Polismyndigheten
    blockerad: true
    skal: >
      Personuppgifter om enskilda. Beställaren har uttryckligen uteslutit källan.
      En fritextsökbar chattbot har annan karaktär än myndighetens egen söksida.

  - id: bolagsverket_verkliga_huvudman
    myndighet: Bolagsverket
    blockerad: true
    skal: >
      Personuppgifter om enskilda fysiska personer. Beställaren har uttryckligen
      uteslutit källan.

  # ---------------------------------------------------------------------------
  # NIVÅ 1 — verifierade, handskrivna adaptrar
  # ---------------------------------------------------------------------------

  - id: riksbanken
    myndighet: Sveriges riksbank
    adapter: riksbanken
    bas_url: https://api.riksbank.se/swea/v1
    verifierad: ja
    verifierat_anrop: GET /Observations/Latest/SEKEURPMI -> {"date":"2026-08-12","value":10.9965}
    autentisering: ingen
    licens: okänd
    attribution: "Källa: Sveriges riksbank"
    # Sänkt från 10/s till 2/s. Vid provkörning 2026-08-13 gav SWEA 429 Too Many
    # Requests efter ett knappt tiotal snabba anrop. Riksbanken publicerar ingen
    # gräns, så vi ligger konservativt.
    takt: { anrop: 2, per_sekunder: 1 }
    cache_ttl: 3600
    manniskolank_mall: "https://www.riksbank.se/sv/statistik/rantor-och-valutakurser/"
    tacker:
      - valutakurser (dagliga, alla par)
      - referensränta (grund för dröjsmålsränta)
      - styrränta, in-/utlåningsränta
      - statsobligationer, statsskuldväxlar
      - penningmängd M1/M2/M3

  - id: scb_pxweb
    myndighet: Statistikmyndigheten SCB
    adapter: pxweb
    bas_url: https://api.scb.se/OV0104/v2beta/api/v2
    verifierad: ja
    verifierat_anrop: GET /tables?lang=sv&pageSize=2 -> 200, samt /config
    autentisering: ingen
    licens: CC0
    attribution: "Källa: SCB"
    # Gränserna nedan är SCB:s egna, hämtade från /config 2026-08-13.
    takt: { anrop: 30, per_sekunder: 10 }
    maxceller: 150000
    cache_ttl: 86400
    manniskolank_mall: "https://www.statistikdatabasen.scb.se/pxweb/sv/ssd/START__{tabell}"
    tacker:
      - KPI, KPIF, PPI
      - löner per bransch
      - företagsstatistik per SNI-kod
      - befolkning, sysselsättning, BNP, utrikeshandel

  - id: ted
    myndighet: Europeiska unionens publikationsbyrå (TED)
    adapter: ted
    bas_url: https://api.ted.europa.eu/v3/notices/search
    metod: POST
    verifierad: ja
    verifierat_anrop: >
      POST med {"query":"buyer-country=SWE","limit":1} -> totalNoticeCount 208215.
      Fältvokabulären är eForms med 1830 giltiga fältnamn; se falturval nedan.
    autentisering: ingen
    licens: "TED Legal Notice, anonym åtkomst till publicerade meddelanden"
    attribution: >-
      Källa: TED (Tenders Electronic Daily), Europeiska unionens publikationsbyrå
    # Konservativt satt. TED:s publicerade fair-usage-gräns är 700 anrop/minut och
    # 600 nedladdningar per 6 minuter — vi ligger långt under med marginal.
    takt: { anrop: 1, per_sekunder: 1 }
    cache_ttl: 3600
    manniskolank_mall: "https://ted.europa.eu/sv/notice/{publication_number}"
    faltval:
      # Kurerat underval — begär ALDRIG alla fält, svaren blir flerspråkiga och enorma.
      - publication-number
      - publication-date
      - notice-type
      - notice-title
      - buyer-name
      - buyer-city
      - classification-cpv
      - procedure-type
      - tender-value
      - tender-value-cur
      - winner-partname
      - winner-country
      - winner-size
    sprakhantering: >
      Textfält är flerspråkiga objekt. Plocka nyckeln "swe", fall tillbaka på "eng",
      därefter första tillgängliga.
    tacker:
      - svenska upphandlingar över EU:s tröskelvärden
      - tilldelningar med kontraktsvärde och vinnare

  - id: riksdagen
    myndighet: Riksdagsförvaltningen
    adapter: riksdagen
    bas_url: https://data.riksdagen.se
    verifierad: ja
    verifierat_anrop: GET /dokumentlista/?sok=moms&utformat=json&sz=1 -> 200
    autentisering: ingen
    licens: okänd
    attribution: "Källa: Sveriges riksdag"
    takt: { anrop: 5, per_sekunder: 1 }
    cache_ttl: 86400
    manniskolank_mall: "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/_{dok_id}/"
    tacker:
      - dokument (propositioner, motioner, betänkanden, SOU)
      - SFS, ledamöter, voteringar, anföranden, kalender

  - id: lagtext
    myndighet: Sveriges riksdag
    adapter: lagtext
    bas_url: https://data.riksdagen.se
    verifierad: ja
    autentisering: ingen
    licens: okänd
    attribution: "Källa: Sveriges riksdag"
    takt: { anrop: 100, per_sekunder: 1 }
    cache_ttl: 86400
    manniskolank_mall: "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/_{dok_id}/"
    tacker:
      - konsoliderad svensk lagtext (SFS)
      - skatte- och redovisningsförfattningar

  - id: kolada
    myndighet: Rådet för främjande av kommunala analyser (RKA)
    adapter: kolada
    bas_url: https://api.kolada.se/v3
    verifierad: ja
    verifierat_anrop: GET /kpi?per_page=1 -> 200 (v2 svarar 410 Gone, använd v3)
    autentisering: ingen
    licens: okänd
    attribution: "Källa: Kolada (RKA)"
    takt: { anrop: 5, per_sekunder: 1 }
    cache_ttl: 86400
    manniskolank_mall: "https://www.kolada.se/verktyg/fri-sokning/"
    tacker:
      - ca 6100 kommunala och regionala nyckeltal

  - id: vies
    myndighet: Europeiska kommissionen (VIES)
    adapter: vies
    bas_url: https://ec.europa.eu/taxation_customs/vies/rest-api
    verifierad: ja
    verifierat_anrop: GET /ms/SE/vat/{nummer} -> JSON med isValid
    autentisering: ingen
    licens: okänd
    attribution: "Källa: EU VIES"
    takt: { anrop: 1, per_sekunder: 2 }
    cache_ttl: 3600
    manniskolank_mall: "https://ec.europa.eu/taxation_customs/vies/"
    tacker:
      - validering av EU-momsregistreringsnummer

  - id: dataportal
    myndighet: Myndigheten för digital förvaltning (DIGG)
    adapter: dataportal
    bas_url: https://admin.dataportal.se/store/search
    verifierad: ja
    verifierat_anrop: >
      GET ?type=solr&query=rdfType:...Dataset AND public:true -> 23293 träffar.
      Facett på "context" fungerar (155 utgivare); facett på "publisher" ger 400.
    autentisering: ingen
    licens: okänd
    attribution: "Källa: Sveriges dataportal"
    takt: { anrop: 5, per_sekunder: 1 }
    cache_ttl: 604800
    manniskolank_mall: "https://www.dataportal.se/datasets/{ctx}_{entry}"
    roll: discovery + nivå-3-fallback
    tacker:
      - 23293 datamängder, 34246 distributioner, 598 dataservices, 155 utgivare

  - id: smhi
    myndighet: SMHI
    adapter: json_rest
    bas_url: https://opendata-download-metobs.smhi.se
    verifierad: ja
    verifierat_anrop: GET /api.json -> 200
    autentisering: ingen
    licens: CC-BY
    attribution: "Källa: SMHI"
    takt: { anrop: 5, per_sekunder: 1 }
    cache_ttl: 3600
    manniskolank_mall: "https://www.smhi.se/data"

  - id: skolverket
    myndighet: Skolverket
    adapter: json_rest
    bas_url: https://api.skolverket.se
    verifierad: ja
    verifierat_anrop: GET /skolenhetsregistret/v1/skolenhet -> 200 (1,4 MB, paginera!)
    autentisering: ingen
    licens: okänd
    attribution: "Källa: Skolverket"
    takt: { anrop: 5, per_sekunder: 1 }
    cache_ttl: 86400
    manniskolank_mall: "https://www.skolverket.se/skolutveckling/statistik"
    varning: Svaren är stora. Paginera alltid; hämta aldrig hela registret i ett anrop.

  - id: trafa
    myndighet: Trafikanalys
    adapter: json_rest
    bas_url: https://api.trafa.se/api
    verifierad: ja
    verifierat_anrop: GET /structure?lang=sv -> 200
    autentisering: ingen
    licens: okänd
    attribution: "Källa: Trafikanalys"
    takt: { anrop: 5, per_sekunder: 1 }
    cache_ttl: 86400
    manniskolank_mall: "https://www.trafa.se/sidor/oppna-data/"

  - id: polisen_handelser
    myndighet: Polismyndigheten
    adapter: json_rest
    bas_url: https://polisen.se/api/events
    verifierad: ja
    verifierat_anrop: GET ?locationname=Stockholm -> 200
    autentisering: ingen
    licens: okänd
    attribution: "Källa: Polismyndigheten"
    takt: { anrop: 2, per_sekunder: 1 }
    cache_ttl: 900
    manniskolank_mall: "https://polisen.se/aktuellt/handelser/"
    notering: >
      Endast händelselistan. Efterlysta personer är en SEPARAT och SPÄRRAD källa
      (se polisen_efterlysta ovan).

  - id: bolagsverket_hvd
    myndighet: Bolagsverket
    adapter: bolagsverket
    bas_url: https://gw.api.bolagsverket.se/vardefulla-datamangder/v1
    verifierad: ja
    aktiverad: true
    # OMFATTNING: ENBART API för värdefulla datamängder (HVD). Denna chatt ska
    # inte använda något annat Bolagsverket-API. Företagsinformation (det
    # avgiftsbelagda avtals-API:t på /foretagsinformation/) och Verkliga
    # huvudmän är UTANFÖR omfattningen — den senare är dessutom blockerad,
    # se posten bolagsverket_verkliga_huvudman överst i denna fil.
    kommentar: >
      Kundanmälan inskickad 2026-08-13. Klientuppgifter till VERIFIERINGSMILJÖN
      mottagna 2026-08-14 och anropade live samma dag (protokollet avläst,
      inte gissat). PRODUKTIONSUPPGIFTER (applikationen "Värdefulla
      datamängder") mottogs separat 2026-08-16 och anropades live samma dag —
      se verifierat_anrop nedan. Källan aktiverades 2026-08-16 på beställarens
      uttryckliga instruktion, i avsteg från den tidigare spärren
      (ARBETSORDER.md regel 2). Datamängden innehåller ingen personuppgift om
      fysiska personer — den är skild från bolagsverket_verkliga_huvudman, som
      förblir spärrad oavsett detta.
    verifierat_anrop: >
      Produktionsmiljön 2026-08-16, med de uppgifter som kom via mejl "Anslutnings-
      uppgifter för Värdefulla datamängder":
      POST https://portal.api.bolagsverket.se/oauth2/token
      (grant_type=client_credentials, HTTP Basic, scope=
      "vardefulla-datamangder:read vardefulla-datamangder:ping" uttryckligen
      angivet — scope=default ger en token utan åtkomst till gatewayen) -> 200,
      Bearer, expires_in 3600.
      GET  https://gw.api.bolagsverket.se/vardefulla-datamangder/v1/isalive
      -> 200 "OK".
      POST /v1/organisationer {"identitetsbeteckning":"5560125790"} -> 200 med
      fullt organisationsobjekt (namn, organisationsform, juridiskForm,
      registreringsdatum, postadress, SNI-koder, verksamhetsbeskrivning m.fl.,
      vart och ett med egen dataproducent Bolagsverket/SCB och egen fel-nyckel
      när uppgiften saknas). Bekräftat mot Aktiebolaget Volvo och Bolagsverket
      självt (varav den senare gav flera fel: ORGANISATION_FINNS_EJ, väntat för
      en myndighet som inte är bolagsregistrerad).
      POST /v1/dokumentlista {"identitetsbeteckning":"5560125790"} -> 200
      {"dokument":[]}.
      Adapterns fältmappning (adaptrar/bolagsverket.py) är skriven mot detta
      observerade schema, inte mot testmiljöns felsvar.
    autentisering: >
      OAuth2 client_credentials (HTTP Basic mot token-endpointen). Scope MÅSTE
      begäras explicit i token-anropet — "vardefulla-datamangder:read
      vardefulla-datamangder:ping" — annars ger portalen en token med
      scope=default som gatewayen avvisar med 900900 Unclassified
      Authentication Failure. Klientuppgifter lagras utanför repot som
      BOLAGSVERKET_CLIENT_ID och BOLAGSVERKET_CLIENT_SECRET.
    token_url: https://portal.api.bolagsverket.se/oauth2/token
    oauth_scope: "vardefulla-datamangder:read vardefulla-datamangder:ping"
    dokumentation: https://bolagsverket.se/apierochoppnadata/hamtaforetagsinformation/vardefulladatamangder/apiforvardefulladatamangder.5513.html
    # Verifieringsmiljöns adresser (2026-08-14). Kvar som dokumentation av vad
    # som testades innan produktionsuppgifterna kom — de får ALDRIG bli
    # token_url/bas_url för den aktiverade källan.
    test_token_url: https://portal-accept2.api.bolagsverket.se/oauth2/token
    test_bas_url: https://gw-accept2.api.bolagsverket.se/vardefulla-datamangder/v1
    licens: okänd
    attribution: "Källa: Bolagsverket"
    takt: { anrop: 2, per_sekunder: 1 }
    cache_ttl: 86400
    tacker:
      - grunddata om företag (namn, form, registreringsdatum, adress)
      - SNI-koder
      - reklamspärr, verksamhetsstatus, avregistrering (SCB/Bolagsverket)
      - digitalt inlämnade årsredovisningar (iXBRL)

  - id: skatteverket_rowstore
    myndighet: Skatteverket
    adapter: rowstore
    bas_url: https://skatteverket.entryscape.net/rowstore/dataset
    verifierad: ja
    aktiverad: true
    verifierat_anrop: >
      Samtliga dataset nedan anropade 2026-08-14, alla 200 OK med rader.
      Omkontrollerade 2026-08-14 mot beställarens förteckning över Skatteverkets
      öppna API:er — samma åtta, alla fortfarande 200 med oförändrat radantal.
    licens: CC0
    attribution: "Källa: Skatteverket"
    takt: { anrop: 3, per_sekunder: 1 }
    cache_ttl: 86400
    manniskolank_mall: "https://www.dataportal.se/datasets?q=Skatteverket"
    # Kurerad katalog. Ett RowStore-UUID går inte att gissa, så utan den här
    # listan är källan i praktiken oanvändbar för modellen — adaptern exponerar
    # den som ett katalogverktyg (ARKITEKTUR.md §5 regel 7).
    #
    # Urvalet kommer från beställarens genomgång av Skatteverkets öppna data
    # 2026-08-14 och innehåller bara datamängder som INTE kräver partneravtal.
    # Kolumnnamnen är avlästa ur faktiska svar, inte gissade.
    #
    # FÄLTET `uppdaterad`: för de åtta första datamängderna nedan bär RowStore-
    # svaret INGET uppdateringsdatum — toppnycklarna är bara
    # limit/next/offset/queryTime/resultCount. Färskheten går alltså inte att
    # läsa ur anropet för dem, vilket §5 regel 8 kräver att den ska kunna.
    # Datumen är där Skatteverkets egen publiceringsuppgift — en PÅSTÅDD
    # färskhet, inte en avläst, och adaptern måste märka den som sådan.
    #
    # Steg 17 (2026-08-14): elva statistikdatamängder tillagda nedan. Till
    # skillnad från de åtta ovan bär VARJE RAD i dessa sin egen
    # `uppdateringsdatum`-kolumn — verifierat live per datamängd. Adaptern
    # läser den ur raden och den är därmed avläst, inte påstådd.
    dataset:
      - uuid: c67b320b-ffee-4876-b073-dd9236cd2a99
        namn: Skattesatser per kommun
        beskrivning: >
          Kommunalskatt, landstingsskatt, begravningsavgift och kyrkoavgift per
          församling och år. Summa både med och utan kyrkoavgift.
          VIKTIGT: kommun- och församlingsnamn lagras med VERSALER
          (kommun=MALMÖ, inte Malmö). Filtret är skiftlägeskänsligt.
          År 2023-2026 finns, cirka 1 270 rader per år.
        kolumner: [år, kommun, församling, församlings-kod, kommunal-skatt,
                   landstings-skatt, begravnings-avgift, kyrkoavgift,
                   "summa, exkl. kyrkoavgift", "summa, inkl. kyrkoavgift"]
        rader: 17254
        uppdaterad: "2025-12-10"

      - uuid: 88320397-5c32-4c16-ae79-d36d95b17b95
        namn: Skattetabeller för månadslön
        beskrivning: >
          Preliminär A-skatt på månadslön per tabellnummer och inkomstintervall.
          Kolumn 1–7 motsvarar skattetabellernas kolumnindelning.
        kolumner: [år, tabellnr, "inkomst fr.o.m.", "inkomst t.o.m.", "antal dgr",
                   "kolumn 1", "kolumn 2", "kolumn 3", "kolumn 4", "kolumn 5",
                   "kolumn 6", "kolumn 7"]
        rader: 76034
        uppdaterad: "2025-12-10"

      - uuid: 293993a8-1b6d-437b-9949-6665836776d5
        namn: Skattetabeller för dagpenning, personer under 66 år
        kolumner: [år, tabellnr, "inkomst fr.om.", "inkomst t.o.m.", "skatt i kr"]
        rader: 149360
        uppdaterad: "2025-12-10"

      - uuid: 0d3eae5d-99c5-4fd3-b954-9ab3bc705671
        namn: Skattetabeller för dagpenning, personer 66 år och äldre
        beskrivning: >
          Preliminär A-skatt på dagpenning för personer över 65 år.
        kolumner: [år, tabellnr, "inkomst fr.om.", "inkomst t.o.m.", "skatt i kr"]
        rader: 136549
        uppdaterad: "2025-12-10"

      - uuid: 006353ad-aa05-4757-bdfd-fae344433a50
        namn: Schablonbelopp för traktamenten
        beskrivning: >
          Traktamente vid tjänsteresa, i Sverige och utomlands. Inkomstår 2018
          och framåt.
        kolumner: [år, "vid tjänsteresa", "i sverige, kr", utomlands]
        rader: 45
        uppdaterad: "2025-12-01"

      - uuid: 28cbac7c-395a-438a-80db-12b955ea3caf
        namn: Schablonvärden för kostförmån
        beskrivning: >
          Förmånsvärde per kosttyp och dag. Kost från arbetsgivaren är en
          skattepliktig förmån. Inkomstår 2018 och framåt.
        kolumner: [år, kost, "kr per dag"]
        rader: 27
        uppdaterad: "2025-12-11"

      - uuid: b4de7df7-63c0-4e7e-bb59-1f156a591763
        namn: Testpersonnummer
        beskrivning: >
          Påhittade personnummer avsedda ENBART för testmiljö, aldrig i
          produktion. Utvecklardata — inte relevant för skatte- eller
          redovisningsfrågor.
        kolumner: [testpersonnummer]
        rader: 43895
        uppdaterad: "2025-12-16"

      - uuid: 9f29fe09-4dbc-4d2f-848f-7cffdd075383
        namn: Testsamordningsnummer
        beskrivning: >
          Påhittade samordningsnummer (12 tecken) avsedda ENBART för testmiljö,
          aldrig i produktion. Utvecklardata.
        kolumner: [testsamordningsnummer]
        rader: 4088
        uppdaterad: "2025-12-12"

      # ------------------------------------------------------------------
      # Steg 17 — statistikdatamängder, utgivare 2021005448. Alla elva
      # anropade live 2026-08-14, samtliga 200 OK. `uppdaterad` nedan är den
      # `uppdateringsdatum` som förekom i det raden vi läste vid kontrollen —
      # ett exempel, inte ett tak; olika rader i samma datamängd kan bära
      # olika uppdateringsdatum eftersom statistiken publiceras löpande.
      # ------------------------------------------------------------------
      - uuid: f2f815f5-8d12-4d22-9a95-b6fda1a58e42
        namn: Antal momsdeklarationer
        beskrivning: >
          Antal inlämnade momsdeklarationer per period, inkomstår och
          gruppering (t.ex. antal anställda). Månadsperiod i kolumnen "period"
          (format ÅÅÅÅMM).
        kolumner: [period, ar_man, uppdateringsdatum, matt, gruppering, antal,
                   statistikterm, inkomstar, grupperingsvärde]
        rader: 165466
        uppdaterad: "2023-10-19"

      - uuid: 7691bcf3-79be-46fb-a252-8442a8f6415e
        namn: Antal inkomstdeklarationer
        beskrivning: >
          Antal inlämnade inkomstdeklarationer (typ 1) per inkomstår och
          gruppering.
        kolumner: [uppdateringsdatum, matt, gruppering, antal, statistikterm,
                   inkomstar, grupperingsvärde]
        rader: 56857
        uppdaterad: "2023-10-06"

      - uuid: 61a28d49-38ca-4686-9a6a-6a9ae4e66d1c
        namn: Antal anmälan för företagsregistrering
        beskrivning: >
          Antal anmälningar för företagsregistrering per period (ÅÅÅÅMM),
          ankomstår, ärendetyp och gruppering.
        kolumner: [period, ankomstar, uppdateringsdatum, matt, gruppering,
                   antal, statistikterm, grupperingsvärde, ar_manad, arendetyp]
        rader: 170054
        uppdaterad: "2025-12-05"

      - uuid: a1866379-6bff-4010-b482-37ce112eeebd
        namn: Antal arbetsgivardeklarationer
        beskrivning: >
          Antal inlämnade arbetsgivardeklarationer per period (ÅÅÅÅMM),
          inkomstår och gruppering.
        kolumner: [period, uppdateringsdatum, matt, gruppering, antal,
                   deklaration, statistikterm, inkomstar, grupperingsvärde,
                   ar_manad]
