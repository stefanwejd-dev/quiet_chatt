  - id: _ogc_wms_wfs
    anvandbar: false
    skal: >
      Cirka 65 procent av dataportalens 598 dataservices är INSPIRE WMS/WFS. De svarar
      med kartbilder eller GML. En chattbot kan inte formulera svar från dem. Filtreras
      bort vid katalogingest (format innehåller VND.OGC eller titeln slutar på
      "visningstjänst"/"nedladdningstjänst").
