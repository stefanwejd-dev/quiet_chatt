# Quiet Öppen Data — Konfiguration
# Byt BARA här om domänen ändras (ARKITEKTUR.md §0).

[site]
domain = "quiet.nu"

[modell]
namn              = "claude-opus-5"
effort_hamtning   = "high"
effort_syntes     = "medium"
max_verktygsvarv  = 8
# Tak för thinking + svarstext per varv i fas A. Adaptiv thinking räknas mot
# samma tak som svarstexten, så för lågt värde trunkerar mitt i ett resonemang.
max_tokens_hamtning = 16000

[kvot]
fragor_per_ip_per_dygn  = 50
fragor_totalt_per_dygn  = 2000
# Hård gräns. Upprätthålls primärt genom att Anthropic-kontot är förskottsbetalt
# utan auto-reload — se ARKITEKTUR.md §6a. Denna rad är ett internt larm, inte
# den enda spärren.
kostnadstak_sek_per_manad = 1000

[index]
db = "data/index.sqlite"
embedding_modell = "KBLab/sentence-bert-swedish-cased"
embedding_dim = 768
