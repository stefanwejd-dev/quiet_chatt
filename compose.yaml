services:
  quiet-oppen-data:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quiet-oppen-data
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MATNING_NYCKEL=${MATNING_NYCKEL:-}
    volumes:
      - data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/halsa')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  hamta-demo:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - data:/app/data
    command: ["python", "-m", "quiet_oppen_data.index.hamta_demo"]

volumes:
  data:
